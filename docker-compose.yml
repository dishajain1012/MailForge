version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reachinbox_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reachinbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reachinbox_password}
      POSTGRES_DB: ${POSTGRES_DB:-reachinbox_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reachinbox} -d ${POSTGRES_DB:-reachinbox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachinbox_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
